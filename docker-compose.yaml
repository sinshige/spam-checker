services:
  # バックエンド (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/spam_db
    depends_on:
      db:
        condition: service_healthy

  # フロントエンド (Next.js)
  frontend:
    image: node:20-slim
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "3000:3000"
    # コンテナ起動時に、フロントエンドの中身が空ならNext.jsを自動初期化し、あれば起動する
    command: >
      sh -c "if [ -z \"$(ls -A /app)\" ]; then
               npx -y create-next-app@latest . --ts --src-dir --app --import-alias '@/*' --use-npm --eslint --tailwind;
             fi &&
             npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    tty: true

  # データベース (PostgreSQL)
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=spam_db
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: